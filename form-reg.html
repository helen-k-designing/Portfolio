<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="apple-touch-icon" sizes="180×180" href="./image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32×32" href="./image/favicon-32×32.png">
    <link rel="icon" type="image/png" sizes="16×16" href="./image/favicon-16×16.png">
    <link rel="stylesheet" href="./css/form-reg.css">
</head>
<body>
   <main>
    <div class="login-container">
        <header class="login-header">
            <h2>Registration</h2>
            <p style="color: #5c5270; font-size: 0.9rem; margin-top: 4px;">Fill in your profile details</p>
        </header>

        <form action="#" method="POST">
            <!-- РЯДОК 1: Прізвище та Ім'я -->
            <div class="form-row">
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="last-name" name="last-name" placeholder="Last Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="first-name" name="first-name" placeholder="First Name" required>
                    </div>
                </div>
            </div>

            <!-- РЯДОК 2: Електронна адреса та Телефон -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" name="phone" placeholder="+380..." required>
                    </div>
                </div>
            </div>

            <!-- РЯДОК 3: Пароль та Підтвердження пароля -->
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required>
                    </div>
                </div>
            </div>

            <!-- Стать (Перемикач жінка / чоловік) -->
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-wrapper">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="female" required>
                        <span>Female</span>
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="male">
                        <span>Male</span>
                    </label>
                </div>
            </div>

            <!-- Кнопка реєстрації -->
            <button type="submit" class="login-btn">Register</button>
        </form>
    </div>
</main>

</body>
</html>
