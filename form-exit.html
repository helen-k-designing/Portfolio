<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="apple-touch-icon" sizes="180×180" href="./image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32×32" href="./image/favicon-32×32.png">
    <link rel="icon" type="image/png" sizes="16×16" href="./image/favicon-16×16.png">
    <link rel="stylesheet" href="css/form-exit.css">
</head>
<body>
   <div class="login-container">
        <div class="close-form-btn">
       <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your email and password to log in.</p>
        </div>
            <form action="/login" method="POST" id="loginForm" class="login-form" 
            autocomplete="off" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="email">Email:</label>
                        <input name="email" id="email" type="email" autocomplete="off" />
                </div>
                </div>
                <span class="error-message" id="emailError"></span>
                <div class="form-group">
                    <div class="input-wrapper">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>
                <span class="error-message" id="passwordError"></span>
                <div class="form-options remember-me">
                    <div class="remember-wrapper">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember Me</label>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="divaider"></div>
               <span class="login-with">Or login with</span>
            <div class="soc-options">
                <button class="google-login">Google</button>
                <button class="github-login">GitHub</button>
            </div>
            <div class="footer-links">
                <a href="/forgot-password">Forgot Password?</a>
                <a href="form-reg.html" class="nav-btn-reg">Don't have an account? Register</a>
            </div>
        </div>
    </div>
</body>
</html>
